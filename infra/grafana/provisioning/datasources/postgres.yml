apiVersion: 1

datasources:
  - name: TrackRecord Postgres
    uid: trackrecord-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: readonly
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${READONLY_PASSWORD}
