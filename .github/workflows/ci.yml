name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ingestor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B verify
